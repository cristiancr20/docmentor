<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0c0e" />
    <meta
      name="description"
      content="DocMentor - Gestión y seguimiento de documentos de proyectos académicos"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!--
      El tema se aplica antes de pintar para que no haya destello claro al
      cargar en oscuro. Es intencionadamente síncrono y mínimo.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("docmentor-theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme = stored || (prefersDark ? "dark" : "light");
          document.documentElement.classList.add(theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.classList.add("light");
        }
      })();
    </script>

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>DocMentor</title>
  </head>
  <body>
    <noscript>Necesitas habilitar JavaScript para usar esta aplicación.</noscript>
    <div id="root"></div>
    <!--
      Se elimina <script src="https://unpkg.com/pdfjs-dist/build/pdf.worker.min.js">:
      un worker cargado como script del hilo principal, desde un CDN y sin SRI.
      La configuración del worker vive en src/setupPdfWorker.js.
    -->
  </body>
</html>
